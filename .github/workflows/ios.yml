# iOS build: game files -> Capacitor iOS app -> signed archive -> TestFlight (App Store Connect).
# Runs only by hand (Actions -> iOS build -> Run workflow). Signing is automatic through the App Store Connect
# API key (Xcode cloud signing); the key lives only in repository secrets and only touches com.simitmartisi.game.
# Secrets: ASC_KEY_P8 (.p8 contents), ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (off = only build and sign)
        type: boolean
        default: true

concurrency: ios-build

defaults:
  run:
    shell: bash  # -eo pipefail: a failing xcodebuild is not hidden by | tail

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Game files and Capacitor sync
        working-directory: app
        run: |
          npm ci
          python3 build.py
          npx cap sync ios

      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"

      # Archive unsigned: automatic signing at archive time wants a development profile, which needs a registered
      # device. The export step below signs for App Store distribution instead (no device needed).
      - name: Archive
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive | tail -n 120

      - name: Export and upload
        working-directory: app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          DEST: ${{ inputs.upload && 'upload' || 'export' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 120

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
